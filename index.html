<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>使用指南生成器</title>

<!-- ============ 导出页面的样式（此处不渲染，导出时读取） ============ -->
<script type="text/css" id="page-style">
:root{
  --bg:#06080d;
  --card:rgba(255,255,255,0.038);
  --card-hover:rgba(255,255,255,0.064);
  --border:rgba(255,255,255,0.085);
  --text:#f2f5fa;
  --muted:#98a1b5;
  --muted-soft:#6d7688;
  --teal:#5eead4;
  --indigo:#818cf8;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  line-height:1.6;
  letter-spacing:-.01em;
  overflow-x:hidden;
  position:relative;
}

/* ---------- 背景光晕（缓慢呼吸 + 鼠标视差） ---------- */
.glow{
  position:fixed;
  border-radius:50%;
  filter:blur(140px);
  pointer-events:none;
  z-index:0;
  will-change:transform;
}
.glow-1{
  width:min(820px,90vw);height:min(820px,90vw);
  background:radial-gradient(circle,rgba(94,234,212,.17),transparent 62%);
  top:-340px;left:-260px;
  animation:breathe 15s ease-in-out infinite;
}
.glow-2{
  width:min(900px,100vw);height:min(900px,100vw);
  background:radial-gradient(circle,rgba(129,140,248,.16),transparent 62%);
  bottom:-400px;right:-300px;
  animation:breathe 19s ease-in-out infinite;
}
.glow-3{
  width:min(560px,70vw);height:min(560px,70vw);
  background:radial-gradient(circle,rgba(94,234,212,.075),transparent 65%);
  top:42%;left:50%;
  margin-left:calc(min(560px,70vw) / -2);
  margin-top:calc(min(560px,70vw) / -2);
  animation:breathe 23s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{opacity:.7}
  50%{opacity:1}
}

/* ---------- 细网格 ---------- */
body::before{
  content:"";
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.021) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.021) 1px,transparent 1px);
  background-size:72px 72px;
  mask-image:radial-gradient(ellipse 75% 55% at 50% 26%,#000 20%,transparent 82%);
  -webkit-mask-image:radial-gradient(ellipse 75% 55% at 50% 26%,#000 20%,transparent 82%);
  pointer-events:none;
  z-index:0;
}

/* ---------- 容器 ---------- */
.wrap{
  position:relative;
  z-index:1;
  max-width:920px;
  margin:0 auto;
  padding:clamp(88px,14vw,180px) 24px clamp(80px,10vw,140px);
}

/* ---------- HERO ---------- */
.hero{
  text-align:center;
  margin-bottom:clamp(64px,11vw,130px);
  animation:heroIn 1.3s var(--ease) both;
}
@keyframes heroIn{
  from{opacity:0;transform:translateY(34px);filter:blur(10px)}
  to{opacity:1;transform:none;filter:blur(0)}
}

.badge{
  display:inline-flex;align-items:center;gap:9px;
  padding:8px 18px;border-radius:999px;
  font-size:12.5px;letter-spacing:.08em;
  color:#b8c2d6;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.09);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  margin-bottom:34px;
}
.badge .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--teal);
  box-shadow:0 0 14px var(--teal);
  animation:pulse 2.6s ease-in-out infinite;
}

h1{
  font-size:clamp(40px,8.4vw,76px);
  font-weight:700;
  letter-spacing:-.045em;
  line-height:1.06;
  margin-bottom:26px;
}
h1 .de{
  font-style:italic;font-weight:400;
  background:linear-gradient(115deg,#5eead4 8%,#818cf8 58%,#c4b5fd 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  padding:0 .08em;
}

/* 副标题：不再限制宽度，长句也保持一行 */
.sub{
  color:var(--muted);
  font-size:clamp(14px,2.1vw,17px);
  line-height:1.8;
  letter-spacing:-.005em;
  margin:0 auto 52px;
}

.specs{
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:12px;
}
.spec{
  display:flex;align-items:center;gap:10px;
  padding:11px 22px;border-radius:16px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  transition:
    transform .55s var(--ease),
    border-color .55s var(--ease),
    background .55s var(--ease),
    box-shadow .55s var(--ease);
  animation:specIn .9s var(--ease) both;
}
.spec:nth-child(1){animation-delay:.32s}
.spec:nth-child(2){animation-delay:.4s}
.spec:nth-child(3){animation-delay:.48s}
.spec:nth-child(4){animation-delay:.56s}
@keyframes specIn{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:none}
}
.spec:hover{
  transform:translateY(-4px);
  background:rgba(255,255,255,.072);
  border-color:rgba(94,234,212,.32);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.1),
    0 14px 34px -14px rgba(94,234,212,.42);
}
.spec .k{font-size:12px;color:var(--muted-soft);letter-spacing:.08em}
.spec .v{font-size:15px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}

/* ---------- 已使用天数 ---------- */
.uptime{
  display:inline-flex;align-items:center;gap:11px;flex-wrap:wrap;justify-content:center;
  margin-top:44px;
  padding:15px 32px 16px;
  border-radius:999px;
  background:linear-gradient(135deg,rgba(94,234,212,.09),rgba(129,140,248,.09));
  border:1px solid rgba(94,234,212,.22);
  box-shadow:
    0 0 64px -20px rgba(94,234,212,.6),
    inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  animation:uptimeIn 1.3s .42s var(--ease) both;
}
@keyframes uptimeIn{
  from{opacity:0;transform:translateY(18px) scale(.96)}
  to{opacity:1;transform:none}
}
.uptime .u-label{font-size:14px;color:#b8c2d6;letter-spacing:.04em}
.uptime .u-num{
  font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(115deg,#5eead4,#818cf8);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.uptime .u-unit{font-size:15px;font-weight:650;color:#a7f3e4;letter-spacing:.02em}
.uptime .u-since{
  font-size:12.5px;color:var(--muted-soft);letter-spacing:.05em;
  padding-left:16px;margin-left:6px;
  border-left:1px solid rgba(255,255,255,.12);
}

/* ---------- 滚动入场 ---------- */
[data-reveal]{
  opacity:0;
  transform:translateY(38px);
  filter:blur(5px);
  transition:
    opacity 1.05s var(--ease),
    transform 1.05s var(--ease),
    filter 1.05s var(--ease);
  will-change:opacity,transform;
}
[data-reveal].revealed{
  opacity:1;
  transform:none;
  filter:blur(0);
}

/* ---------- 卡片 ---------- */
.grid{
  display:grid;
  gap:clamp(22px,3.4vw,30px);
}

.card{
  position:relative;
  padding:clamp(30px,5vw,48px);
  border-radius:clamp(24px,3.4vw,32px);
  background:var(--card);
  border:1px solid var(--border);
  backdrop-filter:blur(26px);
  -webkit-backdrop-filter:blur(26px);
  overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045);
  transition:
    transform .75s var(--ease),
    background .75s var(--ease),
    border-color .75s var(--ease),
    box-shadow .75s var(--ease);
}
.card::before{
  content:"";
  position:absolute;top:0;left:14%;right:14%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  opacity:.7;
}
.card::after{
  content:"";
  position:absolute;
  width:360px;height:360px;
  top:-210px;right:-150px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(94,234,212,.15),transparent 68%);
  opacity:0;
  transition:opacity .95s var(--ease);
  pointer-events:none;
}
.card:hover{
  transform:translateY(-6px);
  background:var(--card-hover);
  border-color:rgba(255,255,255,.16);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 34px 72px -32px rgba(0,0,0,.9),
    0 0 64px -32px rgba(94,234,212,.4);
}
.card:hover::after{opacity:1}

.card-head{
  display:flex;align-items:center;gap:16px;
  margin-bottom:28px;
}
.icon{
  flex:0 0 auto;
  width:52px;height:52px;
  display:grid;place-items:center;
  border-radius:16px;
  font-size:24px;
  background:linear-gradient(140deg,rgba(94,234,212,.16),rgba(129,140,248,.16));
  border:1px solid rgba(255,255,255,.1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
  transition:transform .75s var(--ease);
}
.card:hover .icon{transform:scale(1.07) rotate(-3deg)}
.card h2{
  font-size:clamp(19px,3.1vw,23px);
  font-weight:650;
  letter-spacing:-.022em;
}

.card-body{display:flex;flex-direction:column;gap:16px}
.para{font-size:15.5px;color:#d7dcea;line-height:1.75}
.label{font-size:12px;letter-spacing:.14em;color:var(--muted-soft);text-transform:uppercase}

.steps{list-style:none;display:flex;flex-direction:column;gap:14px}
.step{
  display:flex;gap:15px;align-items:flex-start;
  padding:16px 20px;border-radius:18px;
  background:rgba(255,255,255,.032);
  border:1px solid rgba(255,255,255,.055);
  transition:background .45s var(--ease),border-color .45s var(--ease),transform .45s var(--ease);
}
.step:hover{
  background:rgba(255,255,255,.058);
  border-color:rgba(255,255,255,.11);
  transform:translateX(3px);
}
.num{
  flex:0 0 auto;
  width:27px;height:27px;margin-top:1px;
  display:grid;place-items:center;border-radius:9px;
  font-size:13px;font-weight:700;color:#06251f;
  background:linear-gradient(140deg,var(--teal),#38bdf8);
  box-shadow:0 5px 16px -5px rgba(94,234,212,.75);
}
.step .txt{font-size:15px;color:#d7dcea;line-height:1.7}
.step .txt b{color:#fff;font-weight:650}

kbd{
  display:inline-block;padding:2px 9px;margin:0 2px;border-radius:7px;
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;
  color:#eafff9;background:rgba(94,234,212,.13);
  border:1px solid rgba(94,234,212,.3);
  box-shadow:0 1px 0 rgba(0,0,0,.3);white-space:nowrap;
}

.path{
  display:flex;align-items:center;flex-wrap:wrap;gap:9px;
  padding:18px 20px;border-radius:18px;
  background:rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.075);
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  font-size:14.5px;overflow-x:auto;
}
.crumb{
  padding:6px 13px;border-radius:10px;color:#c8d0e2;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.07);
  white-space:nowrap;
  transition:transform .5s var(--ease),background .5s var(--ease);
}
.crumb:hover{transform:translateY(-2px);background:rgba(255,255,255,.09)}
.crumb.leaf{
  color:#a7f3e4;
  background:linear-gradient(135deg,rgba(94,234,212,.16),rgba(129,140,248,.16));
  border-color:rgba(94,234,212,.34);
  box-shadow:0 0 26px -7px rgba(94,234,212,.55);
  font-weight:600;
}
.sep{color:#4b556b;font-size:13px;user-select:none}

.note{
  display:flex;gap:14px;align-items:flex-start;
  padding:16px 20px;border-radius:18px;
  font-size:14.5px;line-height:1.7;
}
.note-icon{flex:0 0 auto;font-size:17px;line-height:1.55}
.note b,.note strong{color:#fff}
.hl{
  display:inline-block;padding:1px 7px;border-radius:6px;font-weight:650;
  background:rgba(94,234,212,.16);border:1px solid rgba(94,234,212,.35);color:#a7f3e4;
}
.note.warn{
  background:linear-gradient(135deg,rgba(251,191,36,.1),rgba(251,146,60,.055));
  border:1px solid rgba(251,191,36,.26);color:#f5e2b8;
}
.note.warn .hl{background:rgba(251,191,36,.18);border-color:rgba(251,191,36,.4);color:#ffe9b0}
.note.tip{
  background:linear-gradient(135deg,rgba(129,140,248,.1),rgba(94,234,212,.055));
  border:1px solid rgba(129,140,248,.26);color:#ccd2f2;
}
.note.tip .hl{background:rgba(129,140,248,.2);border-color:rgba(129,140,248,.45);color:#dfe4ff}

/* ---------- 页脚 ---------- */
footer{
  margin-top:clamp(64px,9vw,110px);
  text-align:center;
  font-size:13px;
  color:#5c6478;
  letter-spacing:.045em;
  white-space:pre-line;
  line-height:2.05;
}
footer span{color:#8b93a8}

@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.45;transform:scale(.82)}
}

@media (max-width:520px){
  .spec{padding:9px 16px}
  .icon{width:44px;height:44px;font-size:20px;border-radius:14px}
  .path{font-size:13px;padding:15px 16px}
  .crumb{padding:5px 10px}
  .uptime{padding:13px 20px 14px;gap:8px}
  .uptime .u-num{font-size:27px}
  .uptime .u-since{padding-left:11px}
  .step{padding:14px 16px}
  .note{padding:14px 16px}
}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  [data-reveal]{opacity:1!important;transform:none!important;filter:none!important}
}
</script>

<!-- ============ 工具自身样式 ============ -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#07090e;color:#e8ecf5;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{display:flex;height:100vh;overflow:hidden}

.panel{
  width:452px;flex:0 0 auto;display:flex;flex-direction:column;
  background:#0d1017;border-right:1px solid rgba(255,255,255,.08);min-height:0;
}
.app.collapsed .panel{display:none}

.panel-head{
  display:flex;align-items:center;justify-content:space-between;padding:13px 16px;
  border-bottom:1px solid rgba(255,255,255,.07);
  background:linear-gradient(180deg,rgba(255,255,255,.035),transparent);
  flex:0 0 auto;
}
.panel-title{font-size:14px;font-weight:650;letter-spacing:.02em}
.icon-btn{
  width:30px;height:30px;border-radius:9px;cursor:pointer;
  border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#cfd7e6;
  font-size:16px;line-height:1;font-family:inherit;transition:.2s;
}
.icon-btn:hover{background:rgba(255,255,255,.12)}

.panel-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 14px 20px}
.panel-scroll::-webkit-scrollbar{width:9px}
.panel-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:9px;border:2px solid #0d1017}
.panel-scroll::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22)}

.section{margin-bottom:20px}
.section-title{
  display:flex;align-items:center;gap:8px;font-size:11px;font-weight:650;
  letter-spacing:.14em;text-transform:uppercase;color:#66718a;margin-bottom:10px;
}
.section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.1),transparent)}

.stack{display:flex;flex-direction:column;gap:10px}

.locked{
  display:flex;flex-wrap:wrap;gap:7px;
  padding:11px 12px;border-radius:12px;
  border:1px dashed rgba(255,255,255,.13);
  background:rgba(255,255,255,.022);
}
.locked .tag{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 11px;border-radius:9px;
  border:1px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.04);
  font-size:12px;color:#aab4c8;white-space:nowrap;
}
.locked .tag b{color:#e2e8f5;font-weight:600}
.locked-hint{font-size:11.5px;color:#5f6a80;margin-top:8px;line-height:1.5}

.inp{
  width:100%;padding:9px 12px;border-radius:10px;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);
  color:#e8ecf5;font-family:inherit;font-size:13px;outline:none;
  transition:border-color .2s,background .2s,box-shadow .2s;
}
.inp:focus{border-color:rgba(94,234,212,.5);background:rgba(94,234,212,.05);box-shadow:0 0 0 3px rgba(94,234,212,.1)}
.inp::placeholder{color:#5a6478}
textarea.inp{resize:vertical;min-height:62px;line-height:1.6;font-family:inherit}
select.inp{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#7b869e 50%),linear-gradient(135deg,#7b869e 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
select.inp option{background:#101520;color:#e8ecf5}

.field{display:flex;flex-direction:column;gap:6px}
.field-label{font-size:11.5px;color:#7b869e;letter-spacing:.05em}

.row{display:flex;gap:7px;align-items:center}
.row .inp{flex:1 1 auto;min-width:0}
.icon-inp{flex:0 0 48px !important;text-align:center;padding:9px 4px !important;font-size:16px}

.mini{
  flex:0 0 auto;width:28px;height:28px;display:grid;place-items:center;border-radius:8px;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#9aa5bb;
  font-size:12px;cursor:pointer;transition:.18s;font-family:inherit;padding:0;
}
.mini:hover{background:rgba(255,255,255,.11);color:#fff}
.mini:disabled{opacity:.22;cursor:default;background:rgba(255,255,255,.02)}
.mini:disabled:hover{background:rgba(255,255,255,.02);color:#9aa5bb}
.mini.danger:hover{background:rgba(255,90,90,.18);border-color:rgba(255,90,90,.4);color:#ff9d9d}

.ord{
  flex:0 0 auto;width:22px;height:22px;display:grid;place-items:center;border-radius:7px;
  font-size:11px;font-weight:700;color:#06251f;background:linear-gradient(140deg,#5eead4,#38bdf8);
}

.chk{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:9px;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);
  font-size:12px;color:#9aa5bb;cursor:pointer;user-select:none;transition:.18s;white-space:nowrap;
}
.chk:hover{border-color:rgba(94,234,212,.35);color:#a7f3e4}
.chk input{accent-color:#5eead4;cursor:pointer;margin:0}

.chip{
  padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04);color:#b7c1d6;font-size:12px;cursor:pointer;
  font-family:inherit;transition:.18s;
}
.chip:hover{background:rgba(94,234,212,.12);border-color:rgba(94,234,212,.35);color:#a7f3e4}

.add-btn{
  width:100%;margin-top:9px;padding:9px;border-radius:11px;
  border:1px dashed rgba(255,255,255,.16);background:rgba(255,255,255,.02);
  color:#8e99b1;font-size:12.5px;font-family:inherit;cursor:pointer;transition:.2s;
}
.add-btn:hover{border-color:rgba(94,234,212,.45);color:#a7f3e4;background:rgba(94,234,212,.06)}

.empty{font-size:12.5px;color:#5f6a80;text-align:center;padding:14px 0;font-style:italic}

.card-editor{
  border:1px solid rgba(255,255,255,.09);border-radius:16px;
  background:rgba(255,255,255,.022);overflow:hidden;margin-bottom:12px;
}
.ce-head{
  display:flex;gap:7px;align-items:center;padding:10px;
  background:linear-gradient(180deg,rgba(255,255,255,.05),transparent);
  border-bottom:1px solid rgba(255,255,255,.07);
}
.ce-body{padding:12px 12px 4px;display:flex;flex-direction:column;gap:10px}
.ce-foot{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px;
  padding:10px 12px;border-top:1px solid rgba(255,255,255,.055);

.modal-mask{

<body>

<div class="app collapsed" id="app">

  <aside class="panel" id="panel">
    <div class="panel-head">
      <div class="panel-title">✏️ 内容编辑器</div>
      <button class="icon-btn" id="collapseBtn" title="收起面板，只看页面">‹</button>
    </div>

    <div class="panel-scroll">
      <div class="section">
        <div class="section-title">固定信息（不可改）</div>
        <div class="locked" id="locked-info"></div>
        <p class="locked-hint">设备规格、启用日期、标题、副标题与页脚均已写死在页面中。</p>
      </div>

      <div class="section">
        <div class="section-title">卡片</div>
        <div id="cards-list"></div>
        <button class="add-btn" id="addCardBtn">＋ 添加一张卡片</button>
      </div>
    </div>

    <div class="panel-foot">
      <button class="btn" id="syntaxBtn">语法指南</button>
      <button class="btn primary" id="exportBtn">导出 HTML</button>
    </div>
  </aside>

  <main class="stage">
    <button class="fab" id="fab" title="打开编辑器">✏️ 打开编辑器</button>
    <iframe id="preview" title="预览"></iframe>
  </main>

</div>

<div class="modal-mask" id="syntaxModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">📖 文本框语法指南</div>
      <button class="icon-btn" id="closeModal" title="关闭">✕</button>
    </div>

    <div class="modal-body">
      <div class="syn-group-label">行内标记</div>

      <div class="syn-item">
        <span class="syn-code">**文字**</span>
        <span class="syn-arrow">→</span>
        <span class="syn-demo"><b>文字</b>（加粗）</span>
      </div>

      <div class="syn-item">
        <span class="syn-code">`文字`</span>
        <span class="syn-arrow">→</span>
        <span class="syn-demo"><kbd>文字</kbd>（代码 / 按键样式）</span>
      </div>

      <div class="syn-item">
        <span class="syn-code">==文字==</span>
        <span class="syn-arrow">→</span>
        <span class="syn-demo"><span class="hl">文字</span>（高亮）</span>
      </div>

      <div class="syn-item">
        <span class="syn-code">*文字*</span>
        <span class="syn-arrow">→</span>
        <span class="syn-demo"><span class="de">文字</span>（渐变斜体，适合标题）</span>
      </div>

      <div class="syn-group-label">写在哪里</div>

      <div class="syn-item">
        <span class="syn-code">文字 / 小标题</span>
        <span class="syn-arrow">→</span>
        <span class="syn-demo">支持全部四种标记</span>
      </div>

      <div class="syn-item">
        <span class="syn-code">步骤</span>
        <span class="syn-arrow">→</span>
        <span class="syn-demo">每一步支持全部四种标记</span>
      </div>

      <div class="syn-item">
        <span class="syn-code">提示条</span>
        <span class="syn-arrow">→</span>
        <span class="syn-demo">提示内容支持全部四种标记</span>
      </div>

      <div class="syn-item">
        <span class="syn-code">路径</span>
        <span class="syn-arrow">→</span>
        <span class="syn-demo">按原样显示，不解析标记</span>
      </div>

      <div class="syn-note">
        <b>小技巧：</b>标记可以叠加使用，比如
        <span class="syn-code" style="margin:0 4px">`**DSH Launcher**`</span>
        会得到加粗的按键样式。
        忘记写法时随时点左下角的「语法指南」回来看看。
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   1. 固定常量（全部不可编辑）
   ========================================================= */
const DEVICE = {
  specs: [
    { k: "芯片", v: "M5" },
    { k: "存储", v: "512 GB" },
    { k: "内存", v: "16 GB" }
  ],
  startDate: "2026-08-01"
};

const HEADER = {
  badge: "个人使用指南",
  title: "Engggle *de* MacBook",
  subtitle: "这是我的 MacBook 指南，收着一些常用的快捷方式与文件路径，随手翻看、随手取用。"
};

const FOOTER = "由大肥鱼 DeepSeek 生成 · 时间 2026.9.12\n个人使用记录，随用随更新，一切以实际设备为准。";

/* =========================================================
   2. 可编辑内容的默认值
   ========================================================= */
const DEFAULT_CONTENT = {
  cards: [
    {
      icon: "🐳",
      title: "DeepSeek Harness 快捷方式",
      blocks: [
        { type: "steps", items: ["点击程序坞中的 `🐳 DSH Launcher`，启动快捷指令。"] },
        { type: "note", variant: "warn", icon: "⚠️", text: "**结束时**请点击==右上方==的「结束快捷指令」，再关闭窗口。" }
      ]
    },
    {
      icon: "📁",
      title: "OJ 代码存放处",
      blocks: [
        { type: "label", text: "文件路径" },
        { type: "path", crumbs: ["桌面", "college", "2026", { text: "code works", leaf: true }] },
        { type: "note", variant: "tip", icon: "💡", text: "工具箱中有可以直接**复制粘贴**的代码，随手取用即可。" }
      ]
    }
  ]
};

const STORAGE_KEY = "engggle-macbook-guide-content-v9";

/* =========================================================
   3. 状态
   ========================================================= */
let data = (function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && typeof d === "object") {
        if (!Array.isArray(d.cards)) d.cards = [];
        return d;
      }
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_CONTENT));
})();

const preview  = document.getElementById("preview");
const app      = document.getElementById("app");
const scroller = document.querySelector(".panel-scroll");

let previewTimer = null;

function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
}

function touch() {
  persist();
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => {
    preview.srcdoc = buildFullHTML(data);
  }, 130);
}

function rebuild() {
  renderForm();
  persist();
  clearTimeout(previewTimer);
  preview.srcdoc = buildFullHTML(data);
}

/* =========================================================
   4. DOM 小工具
   ========================================================= */
function h(tag, attrs, ...children) {
  const n = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k === "value") n.value = v;
      else if (k === "checked") n.checked = true;
      else if (k === "disabled") n.disabled = true;
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);
      else n.setAttribute(k, v);
    }
  }
  appendAll(n, children);
  return n;
}

function appendAll(node, children) {
  children.flat(Infinity).forEach(c => {
    if (c === null || c === undefined || c === false) return;
    node.appendChild(typeof c === "string" || typeof c === "number"
      ? document.createTextNode(String(c)) : c);
  });
}

function input(value, onInput, placeholder, cls) {
  return h("input", {
    class: "inp" + (cls ? " " + cls : ""),
    type: "text",
    value: value || "",
    placeholder: placeholder || "",
    onInput: e => onInput(e.target.value)
  });
}

function textarea(value, onInput, placeholder) {
  const t = h("textarea", { class: "inp", placeholder: placeholder || "" });
  t.value = value || "";
  t.addEventListener("input", e => onInput(e.target.value));
  return t;
}

function miniBtn(text, title, fn, disabled) {
  return h("button", { class: "mini", text, title, onClick: fn, disabled: !!disabled });
}

function delBtn(fn) {
  return h("button", { class: "mini danger", text: "✕", title: "删除", onClick: fn });
}

function swap(arr, a, b) {
  if (b < 0 || b >= arr.length) return;
  const t = arr[a]; arr[a] = arr[b]; arr[b] = t;
}

const BLOCK_LABELS = { text: "文字", label: "小标题", steps: "步骤", path: "路径", note: "提示条" };

/* =========================================================
   5. 表单渲染
   ========================================================= */
function renderForm() {
  renderLockedInfo();
  renderCards();
}

function renderLockedInfo() {
  const box = document.getElementById("locked-info");
  box.replaceChildren();

  box.appendChild(h("span", { class: "tag" },
    h("span", { text: "设备" }),
    h("b", { text: "MacBook" })
  ));

  DEVICE.specs.forEach(s => {
    box.appendChild(h("span", { class: "tag" },
      h("span", { text: s.k }),
      h("b", { text: s.v })
    ));
  });

  const p = DEVICE.startDate.split("-");
  const since = p.length === 3 ? (p[0] + "." + p[1] + "." + p[2]) : DEVICE.startDate;
  box.appendChild(h("span", { class: "tag" },
    h("span", { text: "启用" }),
    h("b", { text: since })
  ));
}

function renderCards() {
  const box = document.getElementById("cards-list");
  box.replaceChildren();

  if (!Array.isArray(data.cards)) data.cards = [];

  if (!data.cards.length) {
    box.appendChild(h("p", { class: "empty", text: "还没有卡片，点下面的按钮加一张。" }));
    return;
  }

  data.cards.forEach((card, ci) => box.appendChild(cardEditor(card, ci)));
}

function cardEditor(card, ci) {
  if (!Array.isArray(card.blocks)) card.blocks = [];

  const head = h("div", { class: "ce-head" },
    h("input", {
      class: "inp icon-inp", type: "text", value: card.icon || "",
      placeholder: "🐳", title: "图标 emoji",
      onInput: e => { card.icon = e.target.value; touch(); }
    }),
    h("input", {
      class: "inp", type: "text", value: card.title || "",
      placeholder: "卡片标题", style: "flex:1;min-width:0;font-weight:600",
      onInput: e => { card.title = e.target.value; touch(); }
    }),
    miniBtn("↑", "上移卡片", () => { swap(data.cards, ci, ci - 1); rebuild(); }, ci === 0),
    miniBtn("↓", "下移卡片", () => { swap(data.cards, ci, ci + 1); rebuild(); }, ci === data.cards.length - 1),
    delBtn(() => { data.cards.splice(ci, 1); rebuild(); })
  );

  const body = h("div", { class: "ce-body" });
  card.blocks.forEach((block, bi) => body.appendChild(blockEditor(card, block, bi)));

  const foot = h("div", { class: "ce-foot" },
    h("span", { class: "ce-foot-label", text: "添加：" }),
    h("button", { class: "chip", text: "文字", onClick: () => addBlock(card, "text") }),
    h("button", { class: "chip", text: "小标题", onClick: () => addBlock(card, "label") }),
    h("button", { class: "chip", text: "步骤", onClick: () => addBlock(card, "steps") }),
    h("button", { class: "chip", text: "路径", onClick: () => addBlock(card, "path") }),
    h("button", { class: "chip", text: "提示条", onClick: () => addBlock(card, "note") })
  );

  return h("div", { class: "card-editor" }, head, body, foot);
}

function addBlock(card, type) {
  card.blocks.push(newBlock(type));
  rebuild();
}

function newBlock(type) {
  switch (type) {
    case "text":  return { type: "text", text: "在这里写一段说明文字。" };
    case "label": return { type: "label", text: "小标题" };
    case "steps": return { type: "steps", items: ["第一步"] };
    case "path":  return { type: "path", crumbs: ["桌面", "college", "2026", { text: "code works", leaf: true }] };
    case "note":  return { type: "note", variant: "tip", icon: "💡", text: "在这里写提示内容。" };
    default:      return { type: "text", text: "" };
  }
}

function blockEditor(card, block, bi) {
  const body = h("div", { class: "blk-body" });
  const type = block.type;

  if (type === "text" || type === "label") {
    body.appendChild(textarea(
      block.text,
      v => { block.text = v; touch(); },
      type === "text" ? "支持 **加粗**、`代码`、==高亮==" : "小标题文字"
    ));
  }

  else if (type === "steps") {
    if (!Array.isArray(block.items)) block.items = [];
    block.items.forEach((item, si) => {
      body.appendChild(h("div", { class: "row" },
        h("span", { class: "ord", text: String(si + 1) }),
        input(item, v => { block.items[si] = v; touch(); }, "这一步做什么"),
        miniBtn("↑", "上移", () => { swap(block.items, si, si - 1); rebuild(); }, si === 0),
        miniBtn("↓", "下移", () => { swap(block.items, si, si + 1); rebuild(); }, si === block.items.length - 1),
        delBtn(() => { block.items.splice(si, 1); rebuild(); })
      ));
    });
    body.appendChild(h("button", {
      class: "chip", text: "＋ 添加一步",
      onClick: () => { block.items.push("新步骤"); rebuild(); }
    }));
  }

  else if (type === "path") {
    if (!Array.isArray(block.crumbs)) block.crumbs = [];
    block.crumbs.forEach((c, i) => {
      const isObj   = c && typeof c === "object";
      const textVal = isObj ? c.text : c;
      const leafVal = isObj ? !!c.leaf : false;

      const textInput = input(textVal, v => {
        if (typeof block.crumbs[i] === "object") block.crumbs[i].text = v;
        else block.crumbs[i] = v;
        touch();
      }, "文件夹 / 文件名");

      const chk = h("label", { class: "chk", title: "让这一段发光高亮" },
        h("input", {
          type: "checkbox", checked: leafVal,
          onChange: e => {
            const t = (typeof block.crumbs[i] === "object") ? block.crumbs[i].text : block.crumbs[i];
            block.crumbs[i] = e.target.checked ? { text: t, leaf: true } : t;
            rebuild();
          }
        }),
        h("span", { text: "高亮" })
      );

      body.appendChild(h("div", { class: "row" },
        textInput, chk,
        miniBtn("↑", "上移", () => { swap(block.crumbs, i, i - 1); rebuild(); }, i === 0),
        miniBtn("↓", "下移", () => { swap(block.crumbs, i, i + 1); rebuild(); }, i === block.crumbs.length - 1),
        delBtn(() => { block.crumbs.splice(i, 1); rebuild(); })
      ));
    });
    body.appendChild(h("button", {
      class: "chip", text: "＋ 添加一层",
      onClick: () => { block.crumbs.push("新目录"); rebuild(); }
    }));
  }

  else if (type === "note") {
    const sel = h("select", {
      class: "inp", style: "flex:1;min-width:0",
      onChange: e => { block.variant = e.target.value; rebuild(); }
    },
      h("option", { value: "tip",  text: "💡 提示（蓝色）" }),
      h("option", { value: "warn", text: "⚠️ 注意（黄色）" })
    );
    sel.value = block.variant === "warn" ? "warn" : "tip";

    body.appendChild(h("div", { class: "row" },
      sel,
      h("input", {
        class: "inp icon-inp", type: "text", value: block.icon || "",
        placeholder: "💡", title: "图标 emoji",
        onInput: e => { block.icon = e.target.value; touch(); }
      })
    ));

    body.appendChild(textarea(
      block.text,
      v => { block.text = v; touch(); },
      "支持 **加粗**、==高亮==、`代码`"
    ));
  }

  else if (type === "html") {
    body.appendChild(textarea(block.text, v => { block.text = v; touch(); }, "原始 HTML"));
  }

  return h("div", { class: "blk" },
    h("div", { class: "blk-head" },
      h("span", { class: "blk-tag", text: BLOCK_LABELS[type] || type }),
      h("span", { class: "spacer" }),
      miniBtn("↑", "上移此块", () => { swap(card.blocks, bi, bi - 1); rebuild(); }, bi === 0),
      miniBtn("↓", "下移此块", () => { swap(card.blocks, bi, bi + 1); rebuild(); }, bi === card.blocks.length - 1),
      delBtn(() => { card.blocks.splice(bi, 1); rebuild(); })
    ),
    body
  );
}

/* =========================================================
   6. 渲染导出页面
   ========================================================= */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]
  ));
}

function inline(s) {
  let t = esc(s);
  t = t.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  t = t.replace(/`([^`]+)`/g, "<kbd>$1</kbd>");
  t = t.replace(/==([^=]+)==/g, '<span class="hl">$1</span>');
  t = t.replace(/\*([^*]+)\*/g, '<span class="de">$1</span>');
  return t;
}

function parseISO(iso) {
  const p = String(iso || "").split("-").map(Number);
  if (p.length !== 3 || p.some(isNaN)) return null;
  return new Date(p[0], p[1] - 1, p[2]);
}

function calcDays(iso) {
  const s = parseISO(iso);
  if (!s) return 0;
  const n = new Date();
  const today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const d = Math.floor((today - s) / 86400000);
  return isNaN(d) ? 0 : Math.max(0, d);
}

function fmtDate(iso) {
  const p = String(iso || "").split("-").map(Number);
  if (p.length !== 3 || p.some(isNaN)) return "";
  return p[0] + "." + String(p[1]).padStart(2, "0") + "." + String(p[2]).padStart(2, "0");
}

function renderBlock(b) {
  if (!b || !b.type) return "";

  switch (b.type) {
    case "text":
      return `<p class="para">${inline(b.text)}</p>`;

    case "label":
      return `<p class="label">${inline(b.text)}</p>`;

    case "steps":
      return `<ul class="steps">` + (b.items || []).map((it, i) =>
        `<li class="step"><span class="num">${i + 1}</span><div class="txt">${inline(it)}</div></li>`
      ).join("") + `</ul>`;

    case "path":
      return `<div class="path">` + (b.crumbs || []).map((c, i) => {
        const isObj = c && typeof c === "object";
        const text  = isObj ? c.text : c;
        const leaf  = isObj && c.leaf;
        const crumb = `<span class="crumb${leaf ? " leaf" : ""}">${esc(text)}</span>`;
        return (i > 0 ? `<span class="sep">›</span>` : "") + crumb;
      }).join("") + `</div>`;

    case "note": {
      const warn = b.variant === "warn";
      const icon = b.icon || (warn ? "⚠️" : "💡");
      return `<div class="note ${warn ? "warn" : "tip"}">` +
             `<span class="note-icon">${esc(icon)}</span>` +
             `<div>${inline(b.text)}</div></div>`;
    }

    case "html":
      return b.text || "";

    default:
      return "";
  }
}

function renderCard(c, i) {
  const delay = Math.min(i * 0.07, 0.35).toFixed(2);
  return `<div class="card-wrap" data-reveal style="transition-delay:${delay}s">
  <article class="card">
    <div class="card-head">
      <div class="icon">${esc(c.icon || "📄")}</div>
      <h2>${esc(c.title || "未命名卡片")}</h2>
    </div>
    <div class="card-body">
      ${(c.blocks || []).map(renderBlock).join("\n      ")}
    </div>
  </article>
</div>`;
}

function renderHero() {
  const specs = DEVICE.specs
    .map(s => `<div class="spec"><span class="k">${esc(s.k)}</span><span class="v">${esc(s.v)}</span></div>`)
    .join("\n      ");

  const days  = calcDays(DEVICE.startDate);
  const since = fmtDate(DEVICE.startDate);

  return `<header class="hero">
    <div class="badge"><span class="dot"></span>${esc(HEADER.badge)}</div>
    <h1>${inline(HEADER.title)}</h1>
    <p class="sub">${esc(HEADER.subtitle)}</p>
    <div class="specs">
      ${specs}
    </div>
    <div class="uptime">
      <span class="u-label">已使用</span>
      <span class="u-num" id="uptime-days">${days}</span>
      <span class="u-unit">天</span>
      ${since ? `<span class="u-since">自 ${since} 起</span>` : ""}
    </div>
  </header>`;
}

function daysScript(iso) {
  const safe = String(iso || "").replace(/[^0-9-]/g, "");
  return `<script>
(function () {
  var p = "${safe}".split("-");
  var y = parseInt(p[0], 10), m = parseInt(p[1], 10), d = parseInt(p[2], 10);
  if (isNaN(y) || isNaN(m) || isNaN(d)) return;
  var s = new Date(y, m - 1, d);
  var n = new Date();
  var today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  var days = Math.floor((today - s) / 86400000);
  if (isNaN(days) || days < 0) days = 0;
  var el = document.getElementById("uptime-days");
  if (el) el.textContent = days;
})();
<\/script>`;
}

function revealScript() {
  return `<script>
(function () {
  var els = document.querySelectorAll('[data-reveal]');
  if (!('IntersectionObserver' in window)) {
    for (var i = 0; i < els.length; i++) els[i].classList.add('revealed');
  } else {
    var io = new IntersectionObserver(function (entries) {
      for (var i = 0; i < entries.length; i++) {
        if (entries[i].isIntersecting) {
          entries[i].target.classList.add('revealed');
          io.unobserve(entries[i].target);
        }
      }
    }, { threshold: 0.08, rootMargin: '0px 0px -6% 0px' });
    for (var j = 0; j < els.length; j++) io.observe(els[j]);
  }

  var g1 = document.querySelector('.glow-1');
  var g2 = document.querySelector('.glow-2');
  var raf = null;
  document.addEventListener('mousemove', function (e) {
    if (raf) return;
    raf = requestAnimationFrame(function () {
      raf = null;
      var x = (e.clientX / window.innerWidth - 0.5);
      var y = (e.clientY / window.innerHeight - 0.5);
      if (g1) g1.style.transform = 'translate3d(' + (x * 44).toFixed(1) + 'px,' + (y * 28).toFixed(1) + 'px,0)';
      if (g2) g2.style.transform = 'translate3d(' + (x * -34).toFixed(1) + 'px,' + (y * -24).toFixed(1) + 'px,0)';
    });
  }, { passive: true });
})();
<\/script>`;
}

function buildFullHTML(d) {
  const css = document.getElementById("page-style").textContent;
  const plainTitle = String(HEADER.title || "使用指南").replace(/[`*=]/g, "").trim();

  const cards = (d.cards || []).map(renderCard).join("\n\n  ");

  return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${esc(plainTitle)} · 使用指南</title>
<style>${css}</style>
</head>
<body>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<div class="wrap">

  ${renderHero()}

  <section class="grid">
  ${cards}
  </section>

  <footer data-reveal>${inline(FOOTER)}</footer>

</div>

${daysScript(DEVICE.startDate)}
${revealScript()}

</body>
</html>`;
}

  const html = buildFullHTML(data);
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url  = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "macbook-guide.html";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  setTimeout(() => URL.revokeObjectURL(url), 2000);
});

document.getElementById("syntaxBtn").addEventListener("click", () => {
  syntaxModal.classList.add("show");
});

document.getElementById("closeModal").addEventListener("click", () => {
  syntaxModal.classList.remove("show");
});

syntaxModal.addEventListener("click", e => {

});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && syntaxModal.classList.contains("show")) {
    syntaxModal.classList.remove("show");
  }
});
